---
layout: compress
---
<!DOCTYPE html>
<html class="no-js" lang="en">
<head>
    {% include analytics.html %}

    {% include head.html %}
    <link rel="preload" as="image" href="{{ site.url }}/{{ site.background1 }}">
    <link rel="preload" as="image" href="{{ site.url }}/{{ site.background2 }}">
</head>
<body class="home-page">
    {% include nav.html %}
    <!-- Split view: CS photo on the left, art photo on the right -->
    <div class="splitview" aria-hidden="true">
        <div class="panel panel-art">
            <img src="{{ site.url }}/{{ site.background2 }}" alt="" width="1920" height="1280" fetchpriority="high">
        </div>
        <div class="panel panel-cs">
            <div class="panel-inner">
                <img src="{{ site.url }}/{{ site.background1 }}" alt="" width="1920" height="1280" fetchpriority="high">
            </div>
        </div>
        <div class="handle"></div>
        <div class="splitview-shade"></div>
    </div>

    <main class="intro" role="main">
        <div class="intro-card">
            <img src="{{ site.url }}/{{ site.profile }}" class="intro-avatar" width="84" height="84" alt="Portrait of {{ site.title }}">
            <h1 class="intro-name">{{ site.title }}</h1>
            <p class="intro-bio">{{ site.bio | replace: '<br><br>', '<br>' }}</p>
            {% include social-links.html %}
            <nav class="intro-paths" aria-label="Choose a side">
                <a id="artButton" class="path path-art" href="{{ site.url }}/portfolio/">Art</a>
                <a id="csButton" class="path path-cs" href="{{ site.url }}/cs/">CS</a>
            </nav>
        </div>
    </main>
    {% include scripts.html %}
    <script src="{{ site.url }}/assets/js/splitScreen.js?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
